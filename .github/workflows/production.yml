# Deploys to the NEW private EC2 (ol-prod-app-01 / i-0351dd6514d9c3f06) via SSM.
# Current live production stays on branch `production` (SSH to the existing EC2).
# IAM: ol-prod-github-deploy-role trust must allow
#   repo:Project-OL/ol-admin:ref:refs/heads/prodv2
# Build env is the same as current production (api.offoolive.com / live.offoolive.com).
name: Prodv2 build and deploy

on:
  push:
    branches: [prodv2]
  workflow_dispatch:

concurrency:
  group: prodv2-ec2-ol-admin
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::465457334877:role/ol-prod-github-deploy-role
  DEPLOY_BUCKET: ol-production-deploy-artifacts-465457334877
  EC2_INSTANCE_ID: i-0351dd6514d9c3f06

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.offoolive.com/api/v1
          VITE_LIVE_API_BASE_URL: https://live.offoolive.com/api
          VITE_USE_MOCK: 'false'

      - name: Pack artifact
        run: |
          tar -czf admin-artifact.tgz -C dist .
          ls -lh admin-artifact.tgz
          tar -tzf admin-artifact.tgz | head

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ol-admin-${{ github.sha }}
          path: admin-artifact.tgz
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ol-admin-${{ github.sha }}

      - name: Print OIDC sub
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, base64
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(
              url,
              headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          pad = "=" * ((4 - len(payload) % 4) % 4)
          data = json.loads(base64.urlsafe_b64decode(payload + pad))
          print(json.dumps({k: data.get(k) for k in ("sub", "repository", "ref", "aud")}, indent=2))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload deployment artifact to S3
        run: |
          aws s3 cp \
            admin-artifact.tgz \
            "s3://${DEPLOY_BUCKET}/ol-admin/admin-${GITHUB_SHA}.tgz"

      - name: Upload deployment script to S3
        run: |
          aws s3 cp \
            .github/deploy/ec2-unpack-admin.sh \
            "s3://${DEPLOY_BUCKET}/ol-admin/ec2-unpack-admin-${GITHUB_SHA}.sh"

      - name: Send deployment command to EC2
        env:
          ARTIFACT_KEY: ol-admin/admin-${{ github.sha }}.tgz
          DEPLOY_SCRIPT_KEY: ol-admin/ec2-unpack-admin-${{ github.sha }}.sh
        run: |
          COMMAND_ID=$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "ol-admin prodv2 deployment ${GITHUB_SHA}" \
              --parameters commands="[
                \"set -e\",
                \"rm -f /tmp/admin-artifact.tgz /tmp/ec2-unpack-admin.sh\",
                \"aws s3 cp s3://${DEPLOY_BUCKET}/${ARTIFACT_KEY} /tmp/admin-artifact.tgz\",
                \"aws s3 cp s3://${DEPLOY_BUCKET}/${DEPLOY_SCRIPT_KEY} /tmp/ec2-unpack-admin.sh\",
                \"chmod 700 /tmp/ec2-unpack-admin.sh\",
                \"bash /tmp/ec2-unpack-admin.sh\"
              ]" \
              --query 'Command.CommandId' \
              --output text
          )

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for deployment
        run: |
          echo "Waiting for SSM deployment..."

          for i in {1..60}; do
            STATUS=$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query 'Status' \
                --output text
            )

            echo "Attempt $i: SSM status = $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                break
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: $STATUS"

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,StatusDetails:StatusDetails,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output yaml

                exit 1
                ;;

              Pending|InProgress|Delayed)
                sleep 5
                ;;

              *)
                echo "Unknown SSM status: $STATUS"
                sleep 5
                ;;
            esac

            if [ "$i" -eq 60 ]; then
              echo "Deployment timed out waiting for SSM."

              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query '{Status:Status,StatusDetails:StatusDetails,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                --output yaml

              exit 1
            fi
          done

      - name: Show deployment output
        run: |
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,StatusDetails:StatusDetails,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output yaml
