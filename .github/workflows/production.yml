name: Production build and deploy

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: production-ec2-ol-admin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.offoolive.com/api/v1
          VITE_LIVE_API_BASE_URL: https://live.offoolive.com/api
          VITE_USE_MOCK: 'false'

      - name: Pack artifact
        run: |
          tar -czf admin-artifact.tgz -C dist .
          ls -lh admin-artifact.tgz
          tar -tzf admin-artifact.tgz | head

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ol-admin-${{ github.sha }}
          path: admin-artifact.tgz
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ol-admin-${{ github.sha }}

      - name: Check EC2 secrets
        env:
          KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "Set repo secrets EC2_SSH_PRIVATE_KEY, EC2_HOST, and EC2_USER (see workflow comments)."
            exit 1
          fi

      - name: Deploy to EC2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            admin-artifact.tgz "$EC2_USER@$EC2_HOST:/tmp/admin-artifact.tgz"
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" 'bash -s' < .github/deploy/ec2-unpack-admin.sh
# Required GitHub Actions secrets (repo or org):
#   EC2_HOST              e.g. 13.232.76.134
#   EC2_USER              e.g. ec2-user
#   EC2_SSH_PRIVATE_KEY   PEM / OpenSSH private key for that user
# Nginx root on ol-dev: /var/www/admins3jinyu.offoolive.com
#   https://admins3jinyu.offoolive.com
