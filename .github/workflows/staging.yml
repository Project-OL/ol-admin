name: Staging build and deploy

# Same transport as ol-node production.yml: OIDC → S3 → SSM (no SSH :22).

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-ec2-ol-admin
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::465457334877:role/ol-prod-github-deploy-role
  DEPLOY_BUCKET: ol-production-deploy-artifacts-465457334877
  EC2_INSTANCE_ID: i-04b31dbda6ed0edc4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api-staging.offoolive.com/api/v1
          VITE_LIVE_API_BASE_URL: https://live-staging.offoolive.com/api
          VITE_USE_MOCK: 'false'

      - name: Pack artifact
        run: |
          tar -czf admin-artifact.tgz -C dist .
          ls -lh admin-artifact.tgz
          tar -tzf admin-artifact.tgz | head

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ol-admin-${{ github.sha }}
          path: admin-artifact.tgz
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ol-admin-${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload deployment artifact to S3
        run: |
          aws s3 cp admin-artifact.tgz \
            "s3://${DEPLOY_BUCKET}/ol-admin/staging-admin-${GITHUB_SHA}.tgz"

      - name: Upload deployment script to S3
        run: |
          aws s3 cp .github/deploy/ec2-unpack-admin.sh \
            "s3://${DEPLOY_BUCKET}/ol-admin/staging-ec2-unpack-admin-${GITHUB_SHA}.sh"

      - name: Send deployment command to EC2
        env:
          ARTIFACT_KEY: ol-admin/staging-admin-${{ github.sha }}.tgz
          DEPLOY_SCRIPT_KEY: ol-admin/staging-ec2-unpack-admin-${{ github.sha }}.sh
        run: |
          COMMAND_ID=$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --timeout-seconds 1800 \
              --comment "Admin staging deployment ${GITHUB_SHA}" \
              --parameters commands="[
                \"set -e\",
                \"export PATH=/usr/bin:/usr/local/bin:\$PATH\",
                \"rm -f /tmp/admin-artifact.tgz /tmp/ec2-unpack-admin.sh\",
                \"aws s3 cp s3://${DEPLOY_BUCKET}/${ARTIFACT_KEY} /tmp/admin-artifact.tgz\",
                \"aws s3 cp s3://${DEPLOY_BUCKET}/${DEPLOY_SCRIPT_KEY} /tmp/ec2-unpack-admin.sh\",
                \"chmod 700 /tmp/ec2-unpack-admin.sh\",
                \"APP_USER=ec2-user APP_DIR=/var/www/admins3jinyu.offoolive.com ARTIFACT=/tmp/admin-artifact.tgz bash /tmp/ec2-unpack-admin.sh\"
              ]" \
              --query 'Command.CommandId' \
              --output text
          )
          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for deployment
        run: |
          echo "Waiting for SSM deployment..."
          for i in {1..120}; do
            STATUS=$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query 'Status' \
                --output text
            )
            echo "Attempt $i: SSM status = $STATUS"
            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,StatusDetails:StatusDetails,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output yaml
                exit 1
                ;;
              Pending|InProgress|Delayed)
                sleep 5
                ;;
              *)
                echo "Unknown SSM status: $STATUS"
                sleep 5
                ;;
            esac
            if [ "$i" -eq 120 ]; then
              echo "Deployment timed out waiting for SSM."
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query '{Status:Status,StatusDetails:StatusDetails,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                --output yaml
              exit 1
            fi
          done

      - name: Show deployment output
        run: |
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,StatusDetails:StatusDetails,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output yaml
