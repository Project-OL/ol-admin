name: Staging build and deploy

# Mirrors production.yml: Vite build, pack dist, scp, ssh 'bash -s' < unpack.sh
# Staging API/live URLs and APP_DIR=/var/www/admins3jinyu.offoolive.com
# Test push 2026-09-04 to re-verify SSH connectivity from GitHub Actions.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-ec2-ol-admin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api-staging.offoolive.com/api/v1
          VITE_LIVE_API_BASE_URL: https://live-staging.offoolive.com/api
          VITE_USE_MOCK: 'false'

      - name: Pack artifact
        run: |
          tar -czf admin-artifact.tgz -C dist .
          ls -lh admin-artifact.tgz
          tar -tzf admin-artifact.tgz | head

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ol-admin-${{ github.sha }}
          path: admin-artifact.tgz
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ol-admin-${{ github.sha }}

      - name: Check staging EC2 secrets
        env:
          KEY: ${{ secrets.STAGING_EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.STAGING_EC2_HOST }}
          USER: ${{ secrets.STAGING_EC2_USER }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "Set Environment staging secrets: STAGING_EC2_HOST, STAGING_EC2_USER, STAGING_EC2_SSH_PRIVATE_KEY"
            exit 1
          fi

      - name: Deploy to EC2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.STAGING_EC2_HOST }}
          EC2_USER: ${{ secrets.STAGING_EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts || true

          SCP_OK=0
          for i in 1 2 3 4; do
            if scp -i ~/.ssh/id_deploy \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout=20 \
                admin-artifact.tgz "$EC2_USER@$EC2_HOST:/tmp/admin-artifact.tgz"; then
              SCP_OK=1
              break
            fi
            echo "scp attempt $i/4 failed (transient SSH connectivity is known-flaky to this host); retrying in 15s..." >&2
            sleep 15
          done
          [ "$SCP_OK" = "1" ] || { echo "scp upload failed after 4 attempts" >&2; exit 1; }

          SSH_OK=0
          for i in 1 2 3 4; do
            if ssh -i ~/.ssh/id_deploy \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout=20 \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=120 \
                -o TCPKeepAlive=yes \
                "$EC2_USER@$EC2_HOST" \
                'APP_USER=ec2-user APP_DIR=/var/www/admins3jinyu.offoolive.com ARTIFACT=/tmp/admin-artifact.tgz bash -s' \
                < .github/deploy/ec2-unpack-admin.sh; then
              SSH_OK=1
              break
            fi
            echo "ssh deploy attempt $i/4 failed (transient SSH connectivity is known-flaky to this host); retrying in 15s..." >&2
            sleep 15
          done
          [ "$SSH_OK" = "1" ] || { echo "ssh deploy failed after 4 attempts" >&2; exit 1; }
# Same as production.yml. Staging:
#   https://admin-staging.offoolive.com  root /var/www/admins3jinyu.offoolive.com
# Secrets: STAGING_EC2_HOST, STAGING_EC2_USER, STAGING_EC2_SSH_PRIVATE_KEY
# retest 2026-09-05T04:29:20Z — box IP + DNS fixed, verifying staging deploy lands
# 2026-09-05: retry loop added -- SSH to this host intermittently times out during banner
# exchange (worked at 04:29/05:15 UTC, failed by 06:11) while SSM (prodv2) to a different box
# in the same window never failed, so this is specific/intermittent to this EC2's SSH listener,
# not a network-wide issue. The unpack script is idempotent, so retrying the whole ssh call is
# safe even on a failure that happens after the connection banner.
